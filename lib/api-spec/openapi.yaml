openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Maakon crisis-response API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: posts
    description: Need and offer posts
  - name: ngos
    description: Verified NGO listings
  - name: reports
    description: Post reporting
  - name: metadata
    description: Filter options and reference data
  - name: feedback
    description: System feedback and bug reports
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /posts:
    get:
      operationId: listPosts
      tags: [posts]
      summary: List public map posts
      parameters:
        - name: postType
          in: query
          schema:
            type: string
            enum: [need, offer]
        - name: category
          in: query
          schema:
            type: string
        - name: governorate
          in: query
          schema:
            type: string
        - name: district
          in: query
          schema:
            type: string
        - name: urgency
          in: query
          schema:
            type: string
            enum: [critical, high, medium, low]
        - name: activeOnly
          in: query
          description: Set to false to include resolved and expired posts.
          schema:
            type: boolean
            default: true
        - name: verifiedNgoOnly
          in: query
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: List of posts (no private location data)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PostPublic"
    post:
      operationId: createPost
      tags: [posts]
      summary: Create a request or an organization offer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostInput"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPublic"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Offer publishing requires an organization account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /posts/me:
    get:
      operationId: listMyPosts
      tags: [posts]
      summary: List posts created by the authenticated user
      responses:
        "200":
          description: List of the current user's posts (including private location data)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PostPrivate"
        "401":
          description: Unauthorized

  /posts/{id}:
    get:
      operationId: getPost
      tags: [posts]
      summary: Get public post detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post detail (no private location data)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPublic"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updatePost
      tags: [posts]
      summary: Update a post owned by the authenticated user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostInput"
      responses:
        "200":
          description: Post updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPrivate"
        "403":
          description: Activating an offer requires an organization account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
    delete:
      operationId: deletePost
      tags: [posts]
      summary: Delete a post owned by the authenticated user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Post deleted successfully
        "403":
          description: Forbidden
        "404":
          description: Not found

  /posts/{id}/contact-access:
    post:
      operationId: accessPostContact
      tags: [posts]
      summary: Retrieve and audit contact details for an open individual request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: Contact details for a verified, active organization account
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostContact"
        "400":
          description: Invalid post ID
        "401":
          description: Authentication required
        "403":
          description: Verified organization access and a valid CSRF token are required.
        "404":
          description: Open individual request not found
        "429":
          description: Too many contact views

  /ngos:
    get:
      operationId: listNgos
      tags: [ngos]
      summary: List active NGOs in the map directory
      parameters:
        - name: governorate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of active NGOs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ngo"

  /ngos/me/public-contact:
    get:
      operationId: getMyNgoPublicContact
      summary: Get the signed-in user's active organization contact for prefilling a request
      responses:
        "200":
          description: Public profile contact or null
          content:
            application/json:
              schema:
                type: object
                nullable: true
                required: [phone, website]
                properties:
                  phone:
                    type: string
                    nullable: true
                  website:
                    type: string
                    nullable: true
        "401":
          description: Sign-in required
  /admin/posts/{id}/review:
    post:
      operationId: reviewPost
      summary: Decide a submitted need as an MFA-verified administrator
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewPostInput"
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
        "400":
          description: Invalid decision or missing required field
        "403":
          description: Administrator MFA and CSRF token required
        "404":
          description: No submitted need exists with this ID
        "409":
          description: Request changed or was already decided
  /ngos/nearby:
    get:
      operationId: listNearbyNgos
      tags: [ngos]
      summary: List organizations approved for referrals near a district
      parameters:
        - name: governorate
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: district
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Distance and area matches, each capped at five organizations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NearbyNgosResponse"
        "400":
          description: Invalid governorate or district
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reports:
    post:
      operationId: createReport
      tags: [reports]
      summary: Report a post as suspicious or unsafe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportInput"
      responses:
        "201":
          description: Report submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportPublic"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /metadata:
    get:
      operationId: getMetadata
      tags: [metadata]
      summary: Get filter options (categories, governorates, districts)
      responses:
        "200":
          description: Reference data for filter dropdowns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Metadata"

  /feedback:
    post:
      operationId: submitFeedback
      tags: [feedback]
      summary: Submit user feedback or bug report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitFeedbackInput"
      responses:
        "200":
          description: Feedback submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        "400":
          description: Validation error

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    PostPublic:
      type: object
      description: A post with no private location data exposed
      properties:
        id:
          type: integer
        isOwnPost:
          type: boolean
          description: True only when the authenticated viewer owns this post; false for unauthenticated/public viewers.
        ngoId:
          type: integer
          nullable: true
          description: "ID of the NGO if the provider is an NGO"
        postType:
          type: string
          enum: [need, offer]
        title:
          type: string
        category:
          type: string
        description:
          type: string
        urgency:
          type: string
          enum: [critical, high, medium, low]
          nullable: true
        governorate:
          type: string
        district:
          type: string
          nullable: true
        publicLat:
          type: number
          format: double
          nullable: true
          description: Fuzzed district-level latitude (never exact for need posts)
        publicLng:
          type: number
          format: double
          nullable: true
          description: Fuzzed district-level longitude (never exact for need posts)
        providerType:
          type: string
          nullable: true
        verifiedBadgeType:
          type: string
          nullable: true
        contactMethod:
          type: string
          nullable: true
          description: Null in public responses for all need posts.
        contactInfo:
          type: string
          nullable: true
          description: Null in public responses for all need posts.
        publicContactMethod:
          type: string
          enum: [phone, email, website]
          nullable: true
        publicContactInfo:
          type: string
          maxLength: 2048
          nullable: true
        status:
          type: string
          enum: [draft, frozen, pending, active, hidden, resolved, expired, removed]
        reportCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        lastConfirmedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - isOwnPost
        - postType
        - title
        - category
        - description
        - governorate
        - status
        - reportCount
        - createdAt
        - updatedAt

    PostPrivate:
      type: object
      description: A post that includes exact private coordinates and address, returned only to its owner
      allOf:
        - $ref: "#/components/schemas/PostPublic"
        - type: object
          properties:
            userId:
              type: integer
            privateLat:
              type: number
              format: double
              nullable: true
            privateLng:
              type: number
              format: double
              nullable: true
            exactAddressPrivate:
              type: string
              nullable: true

    PostContact:
      type: object
      required: [postId, contactMethod, contactInfo]
      properties:
        postId:
          type: integer
        contactMethod:
          type: string
          nullable: true
        contactInfo:
          type: string
          nullable: true

    NearbyNgosResponse:
      type: object
      required: [distanceMatches, areaMatches]
      properties:
        distanceMatches:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/ReferralPartner"
        areaMatches:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/ReferralPartner"

    ReferralPartner:
      type: object
      required: [id, name, description, governorate, district, phone, website, match]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        governorate:
          type: string
        district:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        match:
          oneOf:
            - type: object
              required: [type, distanceKm]
              properties:
                type:
                  type: string
                  enum: [distance]
                distanceKm:
                  type: number
                  minimum: 0
                  description: Approximate distance from the selected district center in kilometers.
            - type: object
              required: [type, level]
              properties:
                type:
                  type: string
                  enum: [area]
                level:
                  type: string
                  enum: [district, governorate]

    CreatePostInput:
      description: New need posts enter pending review before publication.
      type: object
      properties:
        postType:
          type: string
          enum: [need, offer]
        title:
          type: string
          minLength: 3
          maxLength: 120
        category:
          type: string
        description:
          type: string
          minLength: 10
          maxLength: 1000
        urgency:
          type: string
          enum: [critical, high, medium, low]
          nullable: true
        governorate:
          type: string
        district:
          type: string
          nullable: true
        exactAddressPrivate:
          type: string
          nullable: true
          description: Private address — stored only, NEVER returned publicly
        providerType:
          type: string
          nullable: true
        contactMethod:
          type: string
          nullable: true
        contactInfo:
          type: string
          nullable: true
        publicContactMethod:
          type: string
          enum: [phone, email, website]
          nullable: true
        publicContactInfo:
          type: string
          maxLength: 2048
          nullable: true
        providedLat:
          type: number
          format: double
          nullable: true
          description: Exact user-provided latitude from the map
        providedLng:
          type: number
          format: double
          nullable: true
          description: Exact user-provided longitude from the map
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 90
          nullable: true
          description: How many days until this post expires (default 30)
      required:
        - postType
        - title
        - category
        - description
        - description
        - governorate

    ReviewPostInput:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [accept, freeze, reject]
        expectedUpdatedAt:
          type: string
          format: date-time
          description: Required for acceptance
        reason:
          type: string
          maxLength: 500
          description: Required for rejection

    UpdatePostInput:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          minLength: 10
          maxLength: 1000
        status:
          type: string
          enum: [active, hidden, resolved]

    Ngo:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        governorate:
          type: string
        district:
          type: string
          nullable: true
        lat:
          type: number
          format: double
          nullable: true
        lng:
          type: number
          format: double
          nullable: true
        phone:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - governorate
        - createdAt

    CreateReportInput:
      type: object
      properties:
        postId:
          type: integer
        reason:
          type: string
          enum: [fake, scam, unsafe, outdated, spam, other]
        details:
          type: string
          nullable: true
      required:
        - postId
        - reason

    ReportPublic:
      type: object
      properties:
        id:
          type: integer
        postId:
          type: integer
        reason:
          type: string
        reportedAt:
          type: string
          format: date-time
        status:
          type: string
      required:
        - id
        - postId
        - reason
        - reportedAt
        - status

    Metadata:
      type: object
      properties:
        categories:
          type: array
          items:
            type: string
        governorates:
          type: array
          items:
            type: string
        districts:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        urgencyLevels:
          type: array
          items:
            type: string
        providerTypes:
          type: array
          items:
            type: string
        contactMethods:
          type: array
          items:
            type: string
      required:
        - categories
        - governorates
        - districts
        - urgencyLevels
        - providerTypes
        - contactMethods

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        details:
          type: string
          nullable: true
      required:
        - error

    SubmitFeedbackInput:
      type: object
      properties:
        type:
          type: string
          enum: [general, bug, feature, complaint, other]
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        message:
          type: string
      required:
        - type
        - message
